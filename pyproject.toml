[tool.ruff]
line-length = 110
# NVDA 2025.1, the oldest version the add-on supports, runs Python 3.11.
target-version = "py311"

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

extend-exclude = [
	# Third-party packages (spotipy and its dependencies), kept exactly as released.
	"addon/lib",
	# Build tooling from the NVDA add-on template, maintained by NV Access.
	"site_scons",
	"sconstruct",
	# Mostly a verbatim copy of CPython's Lib/secrets.py, kept identical to it.
	"addon/globalPlugins/accesifyPlay/_secrets_fallback.py",
	# The old script-style tests, retired as their checks move to tests/unit.
	"tests/test_*.py",
	"tests/run_tests.py",
	"tests/_support.py",
	"tests/_strings.py",
]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
	# The code is indented with tabs, like NVDA itself.
	"W191",
	"D206",
	# Conflicts with the formatter, which adds the trailing commas it needs.
	"COM812",
	# Each pair is mutually exclusive; D211 and D212 are the ones kept.
	"D203",
	"D213",
	# A class's docstring describes how to create it, as in the numpy convention.
	"D107",
	# NVDA imports the add-on as globalPlugins.accesifyPlay, the tests import it
	# under another name; relative imports work in both.
	"TID252",
]

# NVDA's logger, so ruff knows log.exception() and exc_info=True report the error.
logger-objects = ["logHandler.log"]

[tool.ruff.lint.per-file-ignores]
# The package name is the add-on's identity: NVDA stores custom gestures under
# globalPlugins.accesifyPlay, so renaming it would silently drop them.
"addon/globalPlugins/accesifyPlay/**" = ["N999"]
# sconstruct, from the NVDA add-on template, reads these names. The add-on's
# description and changelog are prose for the add-on store, kept as written.
"buildVars.py" = ["N816", "E501"]
# Tests assert, use literal expected values and look at private state; the
# stand-in classes inside them mirror real interfaces and need no docstrings;
# a test takes its fixtures and its table's columns as parameters.
"tests/unit/**" = ["S101", "PLR2004", "SLF001", "INP001", "D101", "D102", "PLR0913", "PLR0917"]
# The fakes copy NVDA's and wx's names and signatures, whatever ruff thinks of them.
"tests/fakes/**" = [
	"N802", "N803", "N815", "N816", "N999", "FBT001", "FBT002", "ARG001", "ARG002", "ANN401", "D1",
	"INP001", "A002", "PLW0603", "TRY003", "EM101", "RUF012",
]
# NVDA runs installTasks.py from the add-on's root folder, which is not a package.
"addon/installTasks.py" = ["INP001"]

[tool.ruff.lint.flake8-copyright]
# Empty package markers hold nothing to license.
min-file-size = 1

[tool.ruff.lint.pydocstyle]
# NVDA scripts are described by their decorator, which NVDA shows in Input
# Gestures; a docstring would only repeat it.
ignore-decorators = ["scriptHandler.script"]

[tool.ruff.lint.pep8-naming]
# Names NVDA calls by convention.
extend-ignore-names = [
	"script_*",
	"event_*",
	"makeSettings",
	"onSave",
	"onDiscard",
	"postSave",
	"isValid",
	"onInstall",
	"onUninstall",
	"scriptCategory",
	"N_",
]

[tool.ruff.lint.isort]
# Annotations are not evaluated at runtime, so type-only imports can stay out
# of NVDA's way (and out of import cycles) under TYPE_CHECKING.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-markers --strict-config"
# spotipy warns about the endpoints Spotify retired; the add-on handles them.
filterwarnings = ["ignore::DeprecationWarning:spotipy"]

[tool.coverage.run]
branch = true
source = ["addon/globalPlugins/accesifyPlay"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	# When excluding concrete paths relative to a directory,
	# not matching multiple folders by name e.g. `__pycache__`,
	# paths are relative to the configuration file.
]

# Tell pyright where to load python code from
extraPaths = [
	"./addon",
]

# General config
analyzeUnannotatedFunctions = true
deprecateTypingAliases = true

# Stricter typing
strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# Compliant rules
reportAbstractUsage = true
reportArgumentType = true
reportAssertAlwaysTrue = true
reportAssertTypeFailure = true
reportAssignmentType = true
reportAttributeAccessIssue = true
reportCallInDefaultInitializer = true
reportCallIssue = true
reportConstantRedefinition = true
reportDuplicateImport = true
reportFunctionMemberAccess = true
reportGeneralTypeIssues = true
reportImplicitOverride = true
reportImplicitStringConcatenation = true
reportImportCycles = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportIncompleteStub = true
reportInconsistentConstructor = true
reportInconsistentOverload = true
reportIndexIssue = true
reportInvalidStringEscapeSequence = true
reportInvalidStubStatement = true
reportInvalidTypeArguments = true
reportInvalidTypeForm = true
reportInvalidTypeVarUse = true
reportMatchNotExhaustive = true
reportMissingImports = true
reportMissingModuleSource = true
reportMissingParameterType = true
reportMissingSuperCall = true
reportMissingTypeArgument = true
reportNoOverloadImplementation = true
reportOperatorIssue = true
reportOptionalCall = true
reportOptionalContextManager = true
reportOptionalIterable = true
reportOptionalMemberAccess = true
reportOptionalOperand = true
reportOptionalSubscript = true
reportOverlappingOverload = true
reportPossiblyUnboundVariable = true
reportPrivateImportUsage = true
reportPrivateUsage = true
reportPropertyTypeMismatch = true
reportRedeclaration = true
reportReturnType = true
reportSelfClsParameterName = true
reportShadowedImports = true
reportTypeCommentUsage = true
reportTypedDictNotRequiredAccess = true
reportUnboundVariable = true
reportUndefinedVariable = true
reportUnhashable = true
reportUninitializedInstanceVariable = true
reportUnknownArgumentType = true
reportUnknownLambdaType = true
reportUnknownMemberType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnnecessaryIsInstance = true
reportUnnecessaryTypeIgnoreComment = true
reportUnsupportedDunderAll = true
reportUntypedBaseClass = true
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUntypedNamedTuple = true
reportUnusedCallResult = true
reportUnusedClass = true
reportUnusedCoroutine = true
reportUnusedExcept = true
reportUnusedExpression = true
reportUnusedFunction = true
reportUnusedImport = true
reportUnusedVariable = true
reportWildcardImportFromLibrary = true

reportDeprecated = true

# Can be enabled by generating type stubs for modules via pyright CLI
reportMissingTypeStubs = false

# Bad rules
# These are sorted alphabetically and should be enabled and moved to compliant rules section when resolved.
