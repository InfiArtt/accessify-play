name: Build & Release Addon

on:
  # Auto-release when dev is merged into main
  push:
    branches: [main, master]

  # Also build (but don't release) on PRs targeting main
  pull_request:
    branches: [main, master]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # JOB 1: Build the .nvda-addon and .pot files
  # -----------------------------------------------------------------------
  build:
    name: Build addon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Install system gettext tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gettext

      - name: Lint (pre-commit)
        run: |
          pip install pre-commit
          export SKIP=no-commit-to-branch
          pre-commit run --all-files

      - name: Build addon and generate .pot
        run: scons && scons pot

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged_addon
          retention-days: 7
          path: |
            ./*.nvda-addon
            ./*.pot

  # -----------------------------------------------------------------------
  # JOB 2: Create a GitHub Release (only on push to main/master)
  # -----------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # Only run when a real push lands on main/master (not on PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaged_addon
          path: .   # <-- extract langsung ke root, bukan subfolder

      - name: Read addon version
        id: addon_meta
        run: |
          # Pakai grep supaya gak perlu import scons/buildVars
          VERSION=$(grep -oP 'addon_version="\K[^"]+' buildVars.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"    >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.addon_meta.outputs.version }}"

          # Ambil section versi ini dari CHANGELOG.md saja (bukan semua versi)
          NOTES=$(awk -v ver="## Version $VERSION" '
            /^## /   { if (found) exit; found=0 }
            $0 ~ ver { found=1; next }
            found    { print }
          ' CHANGELOG.md)

          # Hapus baris kosong di awal dan akhir
          NOTES=$(echo "$NOTES" | sed -e '/./,$!d' -e 's/[[:space:]]*$//')

          # Hitung SHA256 checksum file addon
          CHECKSUM=$(sha256sum *.nvda-addon | awk '{print $1, $2}')

          # Gabungkan notes + footer checksum
          BODY="${NOTES}"$'\n\n---\n**SHA256 Checksum:**\n```\n'"${CHECKSUM}"$'\n```'

          # Tulis multiline output dengan aman
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.addon_meta.outputs.tag }}
          name: "AccessifyPlay ${{ steps.addon_meta.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          files: |
            *.nvda-addon
            *.pot
          fail_on_unmatched_files: true
          # Versi yang ada tanda '-' (misal 1.8.0-beta) otomatis jadi pre-release
          prerelease: ${{ contains(steps.addon_meta.outputs.version, '-') }}