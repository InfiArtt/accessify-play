name: Build & Release Addon

on:
  # Auto-release when dev is merged into main
  push:
    branches: [main, master]

  # Also build (but don't release) on PRs targeting main
  pull_request:
    branches: [main, master]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Runs on the same branch queue instead of overlapping. Without this, two quick
# pushes could both see a version as unreleased and both try to publish it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # JOB 1: Build the .nvda-addon and .pot files
  # -----------------------------------------------------------------------
  build:
    name: Build addon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Install system gettext tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gettext

      - name: Lint (pre-commit)
        run: |
          pip install pre-commit
          export SKIP=no-commit-to-branch
          pre-commit run --all-files

      # The tests stub out NVDA and wx, so they run on any OS. A failure stops
      # the build here, before anything can be released.
      - name: Run tests
        env:
          # Importing the add-on's modules would otherwise leave __pycache__
          # folders inside addon/, for the build below to pick up.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pip install -r tests/requirements.txt
          python tests/run_tests.py

      - name: Build addon and generate .pot
        run: scons && scons pot

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged_addon
          retention-days: 7
          path: |
            ./*.nvda-addon
            ./*.pot

  # -----------------------------------------------------------------------
  # JOB 2: Decide whether this push is a release
  # -----------------------------------------------------------------------
  # A release is published only when addon_version in buildVars.py has no
  # release yet. Pushes that leave the version alone (docs, CI, .mailmap, ...)
  # still build and upload the artifact, but publish nothing. Otherwise
  # action-gh-release would find the existing release and replace its files
  # and notes with a rebuild -- a different checksum under the same version,
  # which breaks anything that pinned it, such as the NVDA Add-on Store.
  version-check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      released: ${{ steps.meta.outputs.released }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version and look for an existing release
        id: meta
        run: |
          # grep, so buildVars.py needn't be imported (it needs SCons).
          VERSION=$(grep -oP 'addon_version="\K[^"]+' buildVars.py || true)
          if [ -z "$VERSION" ]; then
            echo "::error file=buildVars.py::addon_version not found in buildVars.py"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

          # --exit-code: 0 = tag exists, 2 = no such tag. Anything else is a
          # failure to check, which must not be read as "not released": that
          # is exactly the case that would publish a duplicate.
          STATUS=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || STATUS=$?
          case "$STATUS" in
            0) RELEASED=true ;;
            2) RELEASED=false ;;
            *) echo "::error::Could not check whether $TAG exists (git ls-remote exit $STATUS)"
               exit 1 ;;
          esac
          echo "released=$RELEASED" >> "$GITHUB_OUTPUT"

          if [ "$RELEASED" = true ]; then
            {
              echo "### $TAG is already released - nothing will be published"
              echo "Bump \`addon_version\` in buildVars.py, with a matching CHANGELOG.md section, to publish a release."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A new version must come with release notes. CHANGELOG.md uses CRLF.
          # No `grep -q`: it exits at the first match, and under pipefail the
          # resulting SIGPIPE in `tr` would fail the check at random.
          if ! tr -d '\r' < CHANGELOG.md | grep -Fx "## Version $VERSION" > /dev/null; then
            echo "::error file=CHANGELOG.md::No '## Version $VERSION' section for the new version $TAG"
            exit 1
          fi
          echo "### $TAG is new - it will be published as a release" >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # JOB 3: Create a GitHub Release (only on push to main/master, new version)
  # -----------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, version-check]
    # Only when a real push lands on main/master (not on PRs), and only for a
    # version that has not been released yet.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.version-check.outputs.released == 'false'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaged_addon
          path: .   # <-- extract langsung ke root, bukan subfolder

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"

          # Ambil section versi ini dari CHANGELOG.md saja (bukan semua versi)
          NOTES=$(awk -v ver="## Version $VERSION" '
            /^## /   { if (found) exit; found=0 }
            $0 ~ ver { found=1; next }
            found    { print }
          ' CHANGELOG.md)

          # Hapus baris kosong di awal dan akhir
          NOTES=$(echo "$NOTES" | sed -e '/./,$!d' -e 's/[[:space:]]*$//')

          # Hitung SHA256 checksum file addon
          CHECKSUM=$(sha256sum *.nvda-addon | awk '{print $1, $2}')

          # Gabungkan notes + footer checksum
          BODY="${NOTES}"$'\n\n---\n**SHA256 Checksum:**\n```\n'"${CHECKSUM}"$'\n```'

          # Tulis multiline output dengan aman
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.version-check.outputs.tag }}
          name: "AccessifyPlay ${{ needs.version-check.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          files: |
            *.nvda-addon
            *.pot
          fail_on_unmatched_files: true
          # Versi yang ada tanda '-' (misal 1.8.0-beta) otomatis jadi pre-release
          prerelease: ${{ contains(needs.version-check.outputs.version, '-') }}
          # Second line of defence: never replace a file on a published release.
          overwrite_files: false