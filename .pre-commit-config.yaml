repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-yaml
  # Same version as the configuration in pyproject.toml was written for.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  # The original project's contributing guide asks for flake8; settings in .flake8.
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        # pre-commit names the files itself, so .flake8's exclude list is repeated here.
        exclude: ^(addon/lib/|site_scons/|sconstruct$|addon/globalPlugins/accesifyPlay/_secrets_fallback\.py$)
